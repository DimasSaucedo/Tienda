# Bloque para redirigir HTTP a HTTPS
server {
    listen 80;
    server_name rinessaucedo.site www.rinessaucedo.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloque para HTTPS
server {
    listen 443 ssl;
    server_name rinessaucedo.site www.rinessaucedo.site;

    # Certificados SSL generados por Certbot
    ssl_certificate /etc/letsencrypt/live/rinessaucedo.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinessaucedo.site/privkey.pem;

    # Seguridad SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    root /var/www/html/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass laravel_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
