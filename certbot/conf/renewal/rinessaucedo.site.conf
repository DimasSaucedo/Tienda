# renew_before_expiry = 30 days
version = 2.11.0
archive_dir = /etc/letsencrypt/archive/rinessaucedo.site
cert = /etc/letsencrypt/live/rinessaucedo.site/cert.pem
privkey = /etc/letsencrypt/live/rinessaucedo.site/privkey.pem
chain = /etc/letsencrypt/live/rinessaucedo.site/chain.pem
fullchain = /etc/letsencrypt/live/rinessaucedo.site/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = bb1633aa6d3cf090b838d1a3cb673c88
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
rinessaucedo.site = /var/www/certbot
www.rinessaucedo.site = /var/www/certbot
